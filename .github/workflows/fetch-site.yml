name: Extraire le site parcours-marianne (Cloudflare Pages)

# Récupère l'intégralité des fichiers publics du site
# https://parcours-marianne-e1u.pages.dev/ (code, contenus pédagogiques,
# catalogue vidéo et sous-titres des capsules) puis les commite dans
# extraction/site/. Les runners GitHub ont un accès Internet complet,
# contrairement au sandbox de l'agent.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0aff8-parcours-marianne1
    paths:
      - '.github/workflows/fetch-site.yml'

permissions:
  contents: write

jobs:
  extraire:
    runs-on: ubuntu-latest
    env:
      BASE: https://parcours-marianne-e1u.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0aff8-parcours-marianne1
          fetch-depth: 1

      - name: Télécharger les fichiers applicatifs
        run: |
          set -euo pipefail
          mkdir -p extraction/site
          FILES="index.html style.css data.js lesson-extras.js exam-bank.js app.js \
                 app-coach-online.js videos-catalog.js manifest.json manifest.webmanifest \
                 downloads.html sw.js robots.txt icons/icon.svg"
          for f in $FILES; do
            out="extraction/site/$f"
            mkdir -p "$(dirname "$out")"
            code=$(curl -sSL --retry 4 --retry-delay 3 -o "$out" -w '%{http_code}' "$BASE/$f" || echo 000)
            size=$(stat -c%s "$out" 2>/dev/null || echo 0)
            # le site est une SPA : un chemin inconnu renvoie la page HTML avec un code 200
            if head -c 200 "$out" 2>/dev/null | grep -qiE '<!doctype|<html'; then
              if [ "${f%%.*}" != "index" ] && [ "$(basename "$f")" != "index.html" ]; then
                echo "$f -> page HTML de repli (fichier inexistant), ignoré"
                rm -f "$out"; continue
              fi
            fi
            echo "$f -> HTTP $code, $size octets"
            if [ "$code" != "200" ] || [ "$size" -lt 20 ]; then
              echo "  (non disponible, ignoré)"
              rm -f "$out"
            fi
          done
          echo "--- fichiers récupérés ---"
          find extraction/site -type f | sort

      - name: Télécharger les sous-titres des capsules (vidéos)
        run: |
          set -euo pipefail
          mkdir -p extraction/site/videos
          ok=0; ko=0
          for n in $(seq -w 1 18); do
            for kind in lesson qa; do
              if [ "$kind" = "lesson" ]; then
                url="$BASE/videos/lesson-$n/lecon-$n.vtt"; out="extraction/site/videos/lesson-$n.vtt"
              else
                url="$BASE/videos/qa-$n/qa-$n.vtt"; out="extraction/site/videos/qa-$n.vtt"
              fi
              code=$(curl -sSL --retry 2 -o "$out" -w '%{http_code}' "$url" || echo 000)
              if [ "$code" = "200" ] && [ "$(stat -c%s "$out")" -gt 50 ] && head -1 "$out" | grep -qi webvtt; then ok=$((ok+1)); else rm -f "$out"; ko=$((ko+1)); fi
            done
          done
          for n in 01 02 03 04; do
            code=$(curl -sSL --retry 2 -o "extraction/site/videos/sit-$n.vtt" -w '%{http_code}' "$BASE/videos/sit-$n/sit-$n.vtt" || echo 000)
            if [ "$code" = "200" ] && [ "$(stat -c%s "extraction/site/videos/sit-$n.vtt")" -gt 50 ] && head -1 "extraction/site/videos/sit-$n.vtt" | grep -qi webvtt; then ok=$((ok+1)); else rm -f "extraction/site/videos/sit-$n.vtt"; ko=$((ko+1)); fi
          done
          echo "Sous-titres récupérés : $ok (indisponibles : $ko)"
          du -sh extraction/site/videos || true

      - name: Vérifier le contenu extrait (rapport, non bloquant)
        run: |
          set -uo pipefail
          node - <<'JS' 2>&1 | tee extraction/VERIFICATION.txt
          const fs = require('fs');
          const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '');
          const rapport = [];
          const stats = {};
          const dir = 'extraction/site';
          const files = fs.existsSync(dir) ? fs.readdirSync(dir) : [];
          rapport.push('Fichiers récupérés : ' + files.join(', '));

          for (const f of files.filter((f) => f.endsWith('.js'))) {
            try {
              new Function(read(dir + '/' + f));
              rapport.push('OK   syntaxe ' + f);
            } catch (e) {
              rapport.push('ERREUR syntaxe ' + f + ' : ' + e.message);
            }
          }

          try {
            const bank = read(dir + '/exam-bank.js');
            if (bank) {
              const json = bank.replace(/^[\s\S]*?=\s*/, '').replace(/;\s*$/, '');
              const arr = JSON.parse(json);
              stats['questions exam-bank'] = arr.length;
              stats['connaissance'] = arr.filter((q) => q.kind === 'connaissance').length;
              stats['situation'] = arr.filter((q) => q.kind === 'situation').length;
              const themes = [...new Set(arr.map((q) => q.theme))].sort();
              stats['themes'] = themes.join(', ');
              const sansExplication = arr.filter((q) => !q.explanation).length;
              stats['sans explication'] = sansExplication;
              const optionsKo = arr.filter((q) => !Array.isArray(q.options) || q.options.length !== 4).length;
              stats['sans 4 options'] = optionsKo;
            }
          } catch (e) { rapport.push('Banque non analysable : ' + e.message); }

          try {
            const data = read(dir + '/data.js');
            if (data) {
              stats['leçons'] = (data.match(/\{id:\d+,videoMin/g) || []).length;
              stats['questions de leçon'] = (data.match(/\bq:'/g) || []).length;
              stats['cartes mémo (facts)'] = (data.match(/facts:\[/g) || []).length;
            }
          } catch (e) { rapport.push('data.js non analysable : ' + e.message); }

          try {
            const cat = read(dir + '/videos-catalog.js');
            if (cat) {
              const j = cat.replace(/^[\s\S]*?=\s*/, '').replace(/;\s*$/, '');
              const arr = JSON.parse(j);
              stats['capsules'] = arr.length;
              stats['durée totale capsules (min)'] = Math.round(arr.reduce((n, v) => n + (v.duration || 0), 0) / 60);
            }
          } catch (e) { rapport.push('catalogue vidéo non analysable : ' + e.message); }

          try {
            const extras = read(dir + '/lesson-extras.js');
            if (extras) stats['enrichissements de leçon'] = (extras.match(/warmup:/g) || []).length;
          } catch (e) {}

          const vdir = dir + '/videos';
          if (fs.existsSync(vdir)) {
            const vtt = fs.readdirSync(vdir).filter((f) => f.endsWith('.vtt'));
            stats['sous-titres VTT'] = vtt.length;
            let lignes = 0;
            for (const f of vtt) lignes += fs.readFileSync(vdir + '/' + f, 'utf8').split('\n').length;
            stats['lignes de sous-titres'] = lignes;
          }

          rapport.push('', 'Statistiques :', JSON.stringify(stats, null, 2));
          console.log(rapport.join('\n'));
          fs.writeFileSync('extraction/STATS.json', JSON.stringify(stats, null, 2));
          if (!stats['questions exam-bank']) console.log('\nATTENTION : banque d’examen absente ou illisible.');
          JS
          echo "Rapport écrit dans extraction/VERIFICATION.txt"

      - name: Écrire le manifeste d'extraction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, datetime, json
          root = pathlib.Path("extraction/site")
          lignes = [
              "# Extraction du site `parcours-marianne-e1u.pages.dev`",
              "",
              "Source : <https://parcours-marianne-e1u.pages.dev/>",
              f"Récupéré le {datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M')} UTC par GitHub Actions.",
              "",
              "| Fichier | Taille | SHA-256 (12 premiers) |",
              "| --- | --- | --- |",
          ]
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  h = hashlib.sha256(p.read_bytes()).hexdigest()[:12]
                  lignes.append(f"| `{p.relative_to(root)}` | {p.stat().st_size} o | `{h}` |")
          stats = pathlib.Path("extraction/STATS.json")
          if stats.exists():
              lignes += ["", "## Statistiques", "", "```json", stats.read_text(encoding="utf-8").strip(), "```"]
          pathlib.Path("extraction/MANIFEST.md").write_text("\n".join(lignes) + "\n", encoding="utf-8")
          print("\n".join(lignes[:20]))
          PY

      - name: Commit et push
        run: |
          set -euxo pipefail
          git config user.name "arena-agent[bot]"
          git config user.email "arena-agent[bot]@users.noreply.github.com"
          git add extraction
          if git diff --cached --quiet; then
            echo "Rien de nouveau à commiter"
          else
            git commit -m "Extraction du site parcours-marianne (Cloudflare Pages) : code, contenus et capsules"
            git push origin HEAD:arena/01a0aff8-parcours-marianne1
          fi
