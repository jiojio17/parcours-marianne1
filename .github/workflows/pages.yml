name: Publier le site (GitHub Pages)

# Construit le site (aucune dépendance) et le publie sur GitHub Pages.
# `enablement: true` demande à l'action « configure-pages » de CRÉER le site Pages
# si nécessaire : normalement, aucun clic préalable dans Settings n'est requis.
# Si l'activation automatique est refusée par GitHub, le workflow s'arrête proprement en
# expliquant la seule action manuelle possible (Settings → Pages → Source : GitHub Actions).

on:
  push:
    branches:
      - arena/01a0aff8-parcours-marianne1
      - main
    paths:
      - 'app/**'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construire la banque et les séries
        run: npm run build

      - name: Contrôles du site
        run: |
          set -euo pipefail
          for f in app/index.html app/manifest.webmanifest app/sw.js \
                   app/icons/icon-192.png app/icons/icon-512.png app/404.html; do
            test -f "$f" || { echo "Fichier manquant : $f"; exit 1; }
          done
          node -e "
            const fs = require('fs');
            const q = fs.readFileSync('app/data/questions.js', 'utf8');
            const s = fs.readFileSync('app/data/series.js', 'utf8');
            const n = (q.match(/\"id\":/g) || []).length;
            const series = (s.match(/serie-/g) || []).length;
            console.log('questions dans la banque :', n);
            console.log('séries d’examen :', series);
            if (n < 400 || series < 40) { console.error('Contenu incomplet'); process.exit(1); }
          "

      - name: Activer GitHub Pages (création du site si besoin)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Repli si l'activation a été refusée
        if: steps.pages.outcome == 'failure'
        run: |
          {
            echo "## ⚙️ Une seule action manuelle est nécessaire"
            echo
            echo "GitHub a refusé l'activation automatique : seuls les administrateurs du dépôt"
            echo "peuvent créer le site Pages."
            echo
            echo "1. Ouvrir **Settings → Pages** : https://github.com/${{ github.repository }}/settings/pages"
            echo "2. Dans **Source**, choisir **GitHub Actions**."
            echo "3. Relancer ce workflow (**Run workflow**)."
            echo
            echo "Adresse publique : **https://${{ github.repository_owner }}.github.io/\${GITHUB_REPOSITORY##*/}/**"
            echo
            echo "En attendant, une adresse publique de secours est disponible :"
            echo "celle du CDN jsDelivr (voir \`docs/DEPLOIEMENT.md\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Activation manuelle requise::Settings → Pages → Source = « GitHub Actions », puis relancer ce workflow. En attendant, le site reste accessible via l'aperçu de travail, le paquet dist/ et le CDN jsDelivr."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: app

      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Adresse du site
        if: steps.pages.outcome == 'success'
        run: |
          echo "Site publié : ${{ steps.deployment.outputs.page_url }}"
          {
            echo "## ✅ Site publié"
            echo
            echo "Adresse publique : ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
